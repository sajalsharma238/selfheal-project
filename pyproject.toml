[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selfheal"
version = "0.1.0"
description = "AI-powered self-healing CI/CD pipeline"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["anthropic>=0.40", "pytest>=8.0"]

[project.scripts]
selfheal = "selfheal.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/selfheal"]